name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run Tests & Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment with npm cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Clean install dependencies ignoring arbitrary lifecycle scripts (SonarCloud security rule S6505)
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Step 4: Run Vitest unit tests in CI mode (vitest run)
      - name: Run unit tests
        run: npm test

      # Step 5: Verify that the project builds without errors
      - name: Run build check
        run: npm run build
