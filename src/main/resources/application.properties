spring.application.name=api

spring.config.import=optional:file:.env[.properties]


spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# SQL logging off by default (prod-safe). Enabled in application-dev.properties for local dev.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# CORS — dev default. Production overrides live in application-prod.properties.
app.cors.allowed-origins=http://localhost:5173

# Rate limiting
app.rate-limit.login.max-attempts=5
app.rate-limit.login.window-seconds=60

# Session cookie — explicit, not relying on browser defaults (BE-014 / CSRF fix).
# These are dev defaults: same-site=Lax is correct here because frontend
# (localhost:5173) and backend are same-site (same registrable domain,
# different port only). Production overrides live in application-prod.properties.
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false