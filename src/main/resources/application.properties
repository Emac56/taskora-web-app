spring.application.name=api

spring.config.import=optional:file:.env[.properties]


spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS
app.cors.allowed-origins=http://localhost:5173

# Rate limiting
app.rate-limit.login.max-attempts=5
app.rate-limit.login.window-seconds=60

# Session cookie — explicit, not relying on browser defaults (BE-014 / CSRF fix)
# same-site=Lax is correct here because frontend (localhost:5173) and backend
# are same-site (same registrable domain, different port only).
# If prod frontend/backend end up on genuinely different domains, switch to
# same-site=None and secure=true (requires HTTPS).
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
