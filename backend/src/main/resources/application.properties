# backend/src/main/resources/application.properties

spring.application.name=api

# Server port — Render (and most PaaS hosts) assign a container port at
# runtime via the PORT env var and only route traffic to that port. Spring
# Boot defaults to a fixed 8080 when server.port is unset, so without this,
# the app binds to 8080 while Render forwards to a different port and the
# app is never reachable. Falls back to 8080 for local/dev where PORT isn't set.
server.port=${PORT:8080}

spring.config.import=optional:file:.env[.properties]


spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# SQL logging off by default (prod-safe). Enabled in application-dev.properties for local dev.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Supabase Storage — tutorial step images.
# SUPABASE_URL is the project base URL (e.g. https://xxxx.supabase.co),
# distinct from SUPABASE_DB_URL, which is the Postgres JDBC connection.
# SUPABASE_SERVICE_ROLE_KEY is secret — server-side only, never sent to the frontend.
app.storage.supabase.url=${SUPABASE_URL}
app.storage.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.storage.supabase.bucket=tutorial-step-images

# Multipart upload limits — matches the 5MB cap enforced in SupabaseStorageClient.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# CORS — dev default. Production overrides live in application-prod.properties.
app.cors.allowed-origins=http://localhost:5173

# Rate limiting
app.rate-limit.login.max-attempts=5
app.rate-limit.login.window-seconds=60

# Session cookie — explicit, not relying on browser defaults (BE-014 / CSRF fix).
# These are dev defaults: same-site=Lax is correct here because frontend
# (localhost:5173) and backend are same-site (same registrable domain,
# different port only). Production overrides live in application-prod.properties.
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Actuator — server monitoring
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
