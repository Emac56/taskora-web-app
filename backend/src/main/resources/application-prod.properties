# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.

# CORS — must be the real deployed frontend origin(s), comma-separated if more than one.
# No default: if CORS_ALLOWED_ORIGINS is unset, startup fails fast instead of
# silently falling back to the http://localhost:5173 dev value in application.properties.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Session cookie policy — explicit, not relying on framework/container defaults (BE-015).
# Frontend and backend are deployed on different domains (cross-origin), so
# SameSite=None is required for the browser to send the cookie on cross-site
# requests. Browsers mandate Secure=true whenever SameSite=None is used, and
# the deployment must be served over HTTPS for the cookie to be sent at all.
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true


# Trust the X-Forwarded-For header set by Render/Cloudflare's edge proxy so
# LoginRateLimiter buckets by real client IP instead of the proxy's internal
# address (verified via curl: without this, every login attempt landed in a
# different bucket and the 429 never triggered).
app.security.trust-proxy-headers=true
