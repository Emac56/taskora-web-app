# Application name
spring.application.name=api-test

# H2 In-Memory Database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate schema configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway during tests so it does not run PostgreSQL scripts against H2
spring.flyway.enabled=false

# Supabase dummy properties to satisfy @Value injections and placeholder resolutions in tests
SUPABASE_DB_URL=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
SUPABASE_DB_USER=sa
SUPABASE_DB_PASSWORD=
SUPABASE_URL=https://dummy.supabase.co
SUPABASE_SERVICE_ROLE_KEY=dummy-test-service-role-key

# Storage configuration defaults for tests
app.storage.supabase.url=https://dummy.supabase.co
app.storage.supabase.service-role-key=dummy-test-service-role-key
app.storage.supabase.bucket=tutorial-step-images

# CORS configuration
app.cors.allowed-origins=http://localhost:5173

# Rate limiting defaults for tests
app.rate-limit.login.max-attempts=5
app.rate-limit.login.window-seconds=60

